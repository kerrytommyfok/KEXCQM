<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工打卡與測驗系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"
        }
    }
    </script>
    
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-zinc-100 font-sans text-zinc-900 pb-20 selection:bg-orange-200">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          FileSpreadsheet, CheckCircle2, XCircle, 
          LogOut, Copy, Download, Settings, Users, ClipboardList, 
          Plus, Trash2, BrainCircuit, Play, CheckSquare,
          Home, Lock
        } from 'lucide-react';

        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, onSnapshot, addDoc } from 'firebase/firestore';

        // Firebase 初始化 (加入了 Error 捕捉，方便於沒有設定 Config 的本地環境測試)
        let app, auth, db;
        try {
            const firebaseConfig = typeof window.__firebase_config !== 'undefined' ? JSON.parse(window.__firebase_config) : {};
            if(Object.keys(firebaseConfig).length > 0) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch(e) {
            console.warn("Firebase 未能成功初始化，系統可能運行在未登入或本地測試狀態。");
        }
        
        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'default-app-id';

        const initialQuestions = [
          {
            id: 'q1',
            text: '第 1 題　銀行體系每個工作天的截數結算時間係幾點？',
            options: ['15:30', '17:30', '18:00', '16:00'],
            correctIndex: 1
          },
          {
            id: 'q2',
            text: '第 2 題　根據收票流程，同事開機收票前必須先做甚麼？',
            options: ['進入管理員模式', '開票箱', '關閉保安警報', '印收據'],
            correctIndex: 2
          },
          {
            id: 'q3',
            text: '第 3 題　關於Y票（結算日期），以下哪項描述係正確？',
            options: ['聽日或之後日期嘅票要收走', '今日或之前日期嘅票要收走', '所有票一律要收走', '只有港幣支票需要核對結算日期'],
            correctIndex: 1
          },
          {
            id: 'q4',
            text: '第 4 題　換票機紙前，同事必須注意甚麼？',
            options: ['確保票機已關閉電源', '先通知組長', '對清楚所屬銀行', '離開管理員模式'],
            correctIndex: 2
          },
          {
            id: 'q5',
            text: '第 5 題　收票時admin咭被票機食咗，同事應如何處理？',
            options: ['自行用工具取回咭', '完成收票後通知主管', '唔可以離開，即時通知主管等候安排', '通知銀行職員處理'],
            correctIndex: 2
          },
          {
            id: 'q6',
            text: '第 6 題　以下哪種情況，同事必須留在現場並即時通知主管？',
            options: ['票機紙用完需要換紙', '功課紙資料填錯', '開機時出現鎖匙/咭斷裂', '票據不符'],
            correctIndex: 2
          },
          {
            id: 'q7',
            text: '第 7 題　如有突發事件影響收票程序，同事應點做？',
            options: ['按經驗自行處理', '不予理會，繼續收票工作', '通知保安員即可', '即時通知主管等候安排，唔應自行處理'],
            correctIndex: 3
          },
          {
            id: 'q8',
            text: '第 8 題　開機時出現橫bar/票箱門開唔到，正確做法係？',
            options: ['用工具自行強行開啟', '唔可以離開，即時通知主管等候安排', '通知保安員代為處理', '聯絡銀行維修部自行安排'],
            correctIndex: 1
          },
          {
            id: 'q9',
            text: '第 9 題　情境：同事收票時，如有客人要求取回票機內支票，以下哪項係正確？',
            options: ['幫忙尋找支票並交回客人', '通知主管並獲得確認後，可以交回客人', '如有銀行職員確認，可以交回客人', '有禮貌拒絕客人要求，請客人自行聯絡客戶服務熱線'],
            correctIndex: 3
          },
          {
            id: 'q10',
            text: '第 10 題　情境：收票時，遇到客人上前搭訕或查看收票工作，以下哪項係正確?',
            options: ['叫客人走開', '有禮貌請客人退後，留出安全空間進行收票工作', '一邊回應客人問題一邊收票', '不作任何回應'],
            correctIndex: 1
          },
          {
            id: 'q11',
            text: '第 11 題　情境：你需要裝入HSBC嘅支票，應選用哪種顏色嘅收票專用袋？',
            options: ['紅色', '綠色', '藍色', '橙色'],
            correctIndex: 0
          },
          {
            id: 'q12',
            text: '第 12 題　情境：收票完成準備離開票機前，同事必須確認甚麼？',
            options: ['確認票箱已上鎖即可離開', '等候組長到場點數後才離開', '確認所有物資及鎖匙數量正確，確保冇嘢遺留', '通知保安員可以離開'],
            correctIndex: 2
          },
          {
            id: 'q13',
            text: '第 13 題　以下哪項係收票時必須遵守的安全要點？',
            options: ['支票袋可暫放係票機旁邊', '收票後盡快順道購物節省時間', '支票、鎖匙和工作袋必須保管在視線範圍內', '收集支票後稍後才拉好拉鍊'],
            correctIndex: 2
          },
          {
            id: 'q14',
            text: '第 14 題　收集支票後，為避免支票外露，應立即做甚麼？',
            options: ['用橡筋捆綁後放係快遞袋外', '放入票箱上暫存', '放入支票袋後不用即時拉鍊', '放入快遞袋暫存'],
            correctIndex: 2
          },
          {
            id: 'q15',
            text: '第 15 題　完成所有收票工序後，同事應如何行動？',
            options: ['順道購物或吸煙後返回', '以最短時間安全返回集散點/目的地，避免閒逛及購物', '在附近等候主管確認', '自行決定下一步行動'],
            correctIndex: 1
          }
        ];

        function App() {
          const [user, setUser] = useState(null);
          // 畫面路由: 'login' | 'quiz' | 'record' | 'checkout' | 'adminLogin' | 'admin'
          const [currentView, setCurrentView] = useState('login'); 
          const [toast, setToast] = useState({ msg: '', type: 'success', visible: false });
          
          // 數據庫狀態
          const [dbQuestions, setDbQuestions] = useState(initialQuestions);
          const [dbRecords, setDbRecords] = useState([]); 
          
          // 當前會話狀態 (Session)
          const [session, setSession] = useState({
            empNo: '',
            clockInTime: null,
            quizAttempts: 0,
            quizPassed: false,
            machineRecords: [{ machineNo: '', bagNo: '' }], 
            clockOutTime: null
          });

          const [askedQuestionIds, setAskedQuestionIds] = useState([]);
          const [activeInput, setActiveInput] = useState({ index: 0, field: 'machineNo' });

          const [currentQuestion, setCurrentQuestion] = useState(null);
          const [selectedOption, setSelectedOption] = useState(null);
          
          const [adminTab, setAdminTab] = useState('records'); 
          const [isAiAnalyzing, setIsAiAnalyzing] = useState(false);
          const [aiReport, setAiReport] = useState('');
          
          const [isAdminAuth, setIsAdminAuth] = useState(false);
          const [adminPassword, setAdminPassword] = useState('');

          useEffect(() => {
            const initAuth = async () => {
              if(!auth) return;
              try {
                  if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                    await signInWithCustomToken(auth, window.__initial_auth_token);
                  } else {
                    await signInAnonymously(auth);
                  }
              } catch(e) {
                  console.warn("Auth initial failed", e);
              }
            };
            initAuth();
            
            if(auth) {
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }
          }, []);

          useEffect(() => {
            if (!user || !db) return;
            try {
                const recordsRef = collection(db, 'artifacts', appId, 'public', 'data', 'attendance_records');
                const unsubscribe = onSnapshot(recordsRef, (snapshot) => {
                  const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                  data.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                  setDbRecords(data);
                }, (error) => {
                  console.error("Error fetching records:", error);
                  showToast('無法讀取雲端紀錄', 'error');
                });
                return () => unsubscribe();
            } catch(e) {
                console.warn("Firestore collection fetching failed", e);
            }
          }, [user]);

          const showToast = (msg, type = 'success') => {
            setToast({ msg, type, visible: true });
            setTimeout(() => setToast(prev => ({ ...prev, visible: false })), 3000);
          };

          const handleClockIn = () => {
            if (!session.empNo.trim()) {
              showToast('請輸入員工編號', 'error');
              return;
            }
            setSession(prev => ({ 
              ...prev, 
              clockInTime: new Date().toLocaleString(),
              quizAttempts: 0,
              quizPassed: false
            }));
            setAskedQuestionIds([]);
            pickRandomQuestion([]);
            setCurrentView('quiz');
            showToast('開工打卡成功！請完成測驗');
          };

          const updateMachineRecord = (index, field, value) => {
            const newRecords = [...session.machineRecords];
            newRecords[index][field] = value.toUpperCase();
            setSession(prev => ({ ...prev, machineRecords: newRecords }));
          };

          const handleKeypadPress = (char) => {
            if (!activeInput) return;
            const { index, field } = activeInput;
            if (index >= session.machineRecords.length) return;
            const currentVal = session.machineRecords[index][field] || '';
            updateMachineRecord(index, field, currentVal + char);
          };

          const handleKeypadBackspace = () => {
            if (!activeInput) return;
            const { index, field } = activeInput;
            if (index >= session.machineRecords.length) return;
            const currentVal = session.machineRecords[index][field] || '';
            updateMachineRecord(index, field, currentVal.slice(0, -1));
          };

          const handleKeypadClear = () => {
            if (!activeInput) return;
            const { index, field } = activeInput;
            if (index >= session.machineRecords.length) return;
            updateMachineRecord(index, field, '');
          };

          const handleNextField = () => {
            if (!activeInput) {
              setActiveInput({ index: 0, field: 'machineNo' });
              return;
            }
            if (activeInput.field === 'machineNo') {
              setActiveInput({ index: activeInput.index, field: 'bagNo' });
            } else {
              if (activeInput.index < session.machineRecords.length - 1) {
                setActiveInput({ index: activeInput.index + 1, field: 'machineNo' });
              } else {
                setActiveInput({ index: 0, field: 'machineNo' });
              }
            }
          };

          const pickRandomQuestion = (alreadyAsked = askedQuestionIds) => {
            const remainingQuestions = dbQuestions.filter(q => !alreadyAsked.includes(q.id));
            
            if (remainingQuestions.length === 0) {
              showToast('已嘗試所有題目且全部答錯！請重新打卡', 'error');
              setCurrentView('login');
              return;
            }

            const randomIndex = Math.floor(Math.random() * remainingQuestions.length);
            setCurrentQuestion(remainingQuestions[randomIndex]);
            setSelectedOption(null);
          };

          const handleAnswerSubmit = () => {
            if (selectedOption === null) {
              showToast('請選擇一個答案', 'error');
              return;
            }

            setSession(prev => ({ ...prev, quizAttempts: prev.quizAttempts + 1 }));

            if (selectedOption === currentQuestion.correctIndex) {
              showToast('答對了！進入下一步');
              setSession(prev => ({ ...prev, quizPassed: true }));
              setCurrentView('record');
            } else {
              const newAsked = [...askedQuestionIds, currentQuestion.id];
              setAskedQuestionIds(newAsked);
              
              const remainingCount = dbQuestions.length - newAsked.length;
              if (remainingCount > 0) {
                showToast(`答錯了！已自動更換下一題 (剩餘 ${remainingCount} 題)`, 'error');
                setTimeout(() => {
                  pickRandomQuestion(newAsked);
                }, 1200);
              } else {
                showToast('已連續答錯全部 15 題！請重新打卡進行測試', 'error');
                setTimeout(() => {
                  setCurrentView('login');
                }, 2000);
              }
            }
          };

          const handleRecordSubmit = () => {
            const validRecords = session.machineRecords.filter(r => r.machineNo.trim() || r.bagNo.trim());
            const hasIncomplete = validRecords.some(r => !r.machineNo.trim() || !r.bagNo.trim());

            if (validRecords.length === 0) {
              showToast('請最少填寫一組票機與票袋編號', 'error');
              return;
            }
            if (hasIncomplete) {
              showToast('請完整填寫已新增的機具資訊', 'error');
              return;
            }

            setSession(prev => ({ ...prev, machineRecords: validRecords }));
            setCurrentView('checkout');
            showToast('紀錄已保存，準備收工');
          };

          const handleClockOut = async () => {
            const clockOutTime = new Date().toLocaleString();
            const baseTimestamp = Date.now();
            
            const gasUrl = "https://script.google.com/macros/s/AKfycbw8aIYEBfTfeJpRrYBY6zazZbtUdnc6lI89LQGvXdmryxde8l9PsCzM2iRIGPykhtZ6/exec";

            let successCount = 0;
            let failCount = 0;

            for (let i = 0; i < session.machineRecords.length; i++) {
              const mr = session.machineRecords[i];
              
              const payloadData = {
                empNo: session.empNo,
                clockInTime: session.clockInTime,
                quizAttempts: session.quizAttempts,
                machineNo: mr.machineNo,
                bagNo: mr.bagNo,
                clockOutTime: clockOutTime
              };

              const finalRecord = {
                empNo: session.empNo,
                clockInTime: session.clockInTime,
                quizAttempts: session.quizAttempts,
                machineRecords: [{ machineNo: mr.machineNo, bagNo: mr.bagNo }],
                clockOutTime: clockOutTime,
                timestamp: baseTimestamp + i
              };

              try {
                const response = await fetch(gasUrl, {
                  method: "POST",
                  headers: { "Content-Type": "text/plain;charset=utf-8" },
                  body: JSON.stringify(payloadData)
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                  successCount++;
                } else {
                  failCount++;
                }
              } catch (err) {
                console.error("發送至 Google Sheets 失敗:", err);
                failCount++;
              }
              
              if (user && db) {
                try {
                    const recordsRef = collection(db, 'artifacts', appId, 'public', 'data', 'attendance_records');
                    await addDoc(recordsRef, finalRecord);
                } catch(e) { console.warn("Firestore save failed", e); }
              } else {
                setDbRecords(prev => [...prev, { ...finalRecord, id: (baseTimestamp + i).toString() }]);
              }
            }

            if (failCount === 0) {
              showToast(`完成！已成功將 ${session.machineRecords.length} 筆獨立紀錄同步至 Google Sheets！`);
            } else {
              showToast(`完成拆分紀錄 (有 ${failCount} 筆同步失敗，但已儲存至系統)`, 'error');
            }
            
            setSession({
              empNo: '',
              clockInTime: null,
              quizAttempts: 0,
              quizPassed: false,
              machineRecords: [{ machineNo: '', bagNo: '' }],
              clockOutTime: null
            });
            setCurrentView('login');
          };

          const handleAdminLoginSubmit = () => {
            if (adminPassword === '3333') {
              setIsAdminAuth(true);
              setAdminPassword('');
              setCurrentView('admin');
              showToast('成功進入後台');
            } else {
              showToast('密碼錯誤，請重新輸入', 'error');
            }
          };

          const exportToExcel = () => {
            if (!window.XLSX) {
              showToast('導出組件加載中，請稍後再試', 'error');
              return;
            }
            const ws = window.XLSX.utils.json_to_sheet(dbRecords.map(r => ({
              '員工編號': r.empNo,
              '開工時間': r.clockInTime,
              '答題嘗試次數': r.quizAttempts,
              '票機編號': r.machineRecords.map(m => m.machineNo).join(', '),
              '票袋編號': r.machineRecords.map(m => m.bagNo).join(', '),
              '完成時間': r.clockOutTime
            })));
            const wb = window.XLSX.utils.book_new();
            window.XLSX.utils.book_append_sheet(wb, ws, "打卡紀錄");
            window.XLSX.writeFile(wb, `員工打卡紀錄_${new Date().toLocaleDateString()}.xlsx`);
            showToast('Excel 下載成功');
          };

          const copyToTSV = () => {
            const headers = ['員工編號', '開工時間', '答題嘗試次數', '票機編號', '票袋編號', '完成時間'];
            const rows = dbRecords.map(r => 
              [
                r.empNo, 
                r.clockInTime, 
                r.quizAttempts, 
                r.machineRecords.map(m => m.machineNo).join(', '), 
                r.machineRecords.map(m => m.bagNo).join(', '), 
                r.clockOutTime
              ].join('\t')
            );
            const tsvContent = [headers.join('\t'), ...rows].join('\n');

            const textArea = document.createElement("textarea");
            textArea.value = tsvContent;
            document.body.appendChild(textArea);
            textArea.select();
            try {
              document.execCommand('copy');
              showToast('已複製為 Google Sheets 格式 (TSV)');
            } catch (err) {
              showToast('複製失敗，請手動選取', 'error');
            }
            document.body.removeChild(textArea);
          };

          const runAiAnalysis = () => {
            setIsAiAnalyzing(true);
            setTimeout(() => {
              const total = dbRecords.length;
              if(total === 0) {
                setAiReport("目前無足夠數據進行分析。");
              } else {
                const avgAttempts = (dbRecords.reduce((acc, curr) => acc + curr.quizAttempts, 0) / total).toFixed(1);
                const errorProne = avgAttempts > 1.5 ? "偏高，建議加強 CQM 基礎操作培訓" : "良好，員工普遍熟悉操作";
                setAiReport(`【AI 分析報告】\n總打卡人次: ${total} 次。\n平均答題嘗試次數: ${avgAttempts} 次。\n操作熟悉度評估: ${errorProne}。\n建議: 針對答錯重試超過 2 次的員工進行針對性指導。`);
              }
              setIsAiAnalyzing(false);
              showToast('AI 分析完成');
            }, 2000);
          };

          const renderLogin = () => (
            <div className="flex flex-col items-center justify-center animate-fade-in-up pt-6">
              <div className="w-24 h-24 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center mb-6 shadow-sm">
                <Users size={40} />
              </div>
              <h2 className="text-2xl font-bold text-zinc-800 mb-2">員工打卡系統</h2>
              <p className="text-zinc-500 mb-8 text-center">請輸入您的員工編號以開始今日的工作流程</p>
              
              <input 
                type="text" 
                placeholder="例如: EMP-001"
                value={session.empNo}
                onChange={(e) => setSession(prev => ({ ...prev, empNo: e.target.value }))}
                onKeyDown={(e) => e.key === 'Enter' && handleClockIn()}
                className="w-full text-center text-xl bg-zinc-50 border-2 border-zinc-200 rounded-[2rem] px-6 py-4 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-100 transition-all mb-6"
              />
              
              <button 
                onClick={handleClockIn}
                className="w-full bg-orange-500 hover:bg-orange-600 text-white rounded-[2rem] px-6 py-4 font-bold text-lg shadow-sm transition-all duration-300 transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2"
              >
                <Play size={24} /> 開工打卡
              </button>
            </div>
          );

          const renderQuiz = () => (
            <div className="flex flex-col animate-fade-in-up">
              <div className="flex items-center gap-3 mb-6">
                <div className="bg-zinc-100 p-3 rounded-full text-zinc-600">
                  <BrainCircuit size={24} />
                </div>
                <div>
                  <h2 className="text-xl font-bold text-zinc-800">CQM 隨機測驗</h2>
                  <p className="text-sm text-zinc-500">
                    答對才能繼續 (進度: 第 {askedQuestionIds.length + 1} 題 / 剩餘 {dbQuestions.length - askedQuestionIds.length} 題未考)
                  </p>
                </div>
              </div>

                </div>
              </header>

              <main className={`p-4 sm:p-6 mt-4 sm:mt-8 mx-auto transition-all duration-500 ease-out ${currentView === 'admin' ? 'max-w-5xl' : 'max-w-md'}`}>
                <div className="bg-white rounded-[2rem] sm:rounded-[2.5rem] shadow-sm border border-zinc-100 p-6 sm:p-10 min-h-[400px]">
                  {currentView === 'login' && renderLogin()}
                  {currentView === 'quiz' && renderQuiz()}
                  {currentView === 'record' && renderRecord()}
                  {currentView === 'checkout' && renderCheckout()}
                  {currentView === 'adminLogin' && renderAdminLogin()}
                  {currentView === 'admin' && renderAdmin()}
                </div>
              </main>

              <div 
                className={`fixed bottom-6 left-1/2 transform -translate-x-1/2 transition-all duration-300 z-50 ${
                  toast.visible ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0 pointer-events-none'
                }`}
              >
                <div className={`flex items-center gap-2 px-6 py-3 rounded-full shadow-lg text-white font-medium ${
                  toast.type === 'error' ? 'bg-red-500' : 'bg-zinc-800'
                }`}>
                  {toast.type === 'error' ? <XCircle size={18} /> : <CheckCircle2 size={18} />}
                  {toast.msg}
                </div>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
