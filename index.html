<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CQM員工打卡系統</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons (Browser version) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <style>
        /* Custom Keyframe Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* Optional: Hide scrollbar for cleaner look if needed */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body class="bg-zinc-100 font-sans text-zinc-900 selection:bg-orange-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Helper Components & Icons (Replacing direct Lucide imports) ---
        // We use SVG directly here to ensure it works flawlessly in the standalone browser build without module bundlers.
        const IconCheckCircle2 = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-check-circle-2 ${className}`}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
        );
        const IconXCircle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-x-circle ${className}`}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
        );
        const IconCopy = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-copy ${className}`}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        );
        const IconDownload = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-download ${className}`}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        );
        const IconSettings = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-settings ${className}`}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        );
        const IconClipboardList = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-clipboard-list ${className}`}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
        );
        const IconPlus = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-plus ${className}`}><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        );
        const IconPlay = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-play ${className}`}><polygon points="6 3 20 12 6 21 6 3"/></svg>
        );
        const IconCheckSquare = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-check-square ${className}`}><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        );
        const IconHome = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-home ${className}`}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        );
        const IconLock = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-lock ${className}`}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        );
        const IconLoader2 = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-loader-2 ${className}`}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        );
        const IconFileSpreadsheet = ({ size = 24, className = "" }) => (
             <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-file-spreadsheet ${className}`}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/></svg>
        );


        // --- Utility Functions ---
        const formatCustomDateTime = (dateInput = new Date()) => {
            const d = new Date(dateInput);
            if (isNaN(d.getTime())) return typeof dateInput === 'string' ? dateInput : '';

            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();

            let hours = d.getHours();
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const seconds = String(d.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            const strHours = String(hours).padStart(2, '0');

            return `${day}/${month}/${year}, ${strHours}:${minutes}:${seconds} ${ampm}`;
        };

        const KexLogo = () => (
            <svg viewBox="0 0 350 120" className="w-56 h-auto mx-auto mb-6 drop-shadow-sm">
                <rect x="10" y="10" width="330" height="100" rx="20" fill="white" stroke="#f97316" strokeWidth="12" />
                <g stroke="#f97316" strokeWidth="12" strokeLinecap="round" strokeLinejoin="round" fill="none">
                    <path d="M 60 35 L 60 85" />
                    <path d="M 120 35 L 60 60 L 120 85" />
                    <path d="M 190 35 L 140 35 L 140 85 L 190 85" />
                    <path d="M 140 60 L 175 60" />
                    <path d="M 230 35 L 290 85" />
                    <path d="M 290 35 L 230 85" />
                </g>
            </svg>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [currentView, setCurrentView] = useState('login'); 
            const [toast, setToast] = useState({ msg: '', type: 'success', visible: false });
            
            // In a standalone HTML file without Firebase, we rely entirely on local state/GAS for records.
            const [dbRecords, setDbRecords] = useState([]);
            
            const [session, setSession] = useState({
                empNo: '',
                clockInTime: null,
                machineRecords: [{ machineNo: '', bagNo: '' }],
                clockOutTime: null
            });

            const [activeInput, setActiveInput] = useState({ index: 0, field: 'machineNo' });
            
            const [adminTab, setAdminTab] = useState('records');
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');

            const [isSubmitting, setIsSubmitting] = useState(false);

            const showToast = (msg, type = 'success') => {
                setToast({ msg, type, visible: true });
                setTimeout(() => setToast(prev => ({ ...prev, visible: false })), 3000);
            };

            const handleClockIn = () => {
                if (!session.empNo.trim()) {
                    showToast('請輸入員工編號', 'error');
                    return;
                }
                setSession(prev => ({ 
                    ...prev, 
                    clockInTime: formatCustomDateTime(new Date()),
                }));
                // Skip quiz, go directly to record page
                setCurrentView('record');
                showToast('開工打卡成功！請輸入機台紀錄');
            };

            const updateMachineRecord = (index, field, value) => {
                const newRecords = [...session.machineRecords];
                newRecords[index][field] = value.toUpperCase();
                setSession(prev => ({ ...prev, machineRecords: newRecords }));
            };

            const handleKeypadPress = (char) => {
                if (!activeInput) return;
                const { index, field } = activeInput;
                if (index >= session.machineRecords.length) return;
                const currentVal = session.machineRecords[index][field] || '';
                updateMachineRecord(index, field, currentVal + char);
            };

            const handleKeypadBackspace = () => {
                if (!activeInput) return;
                const { index, field } = activeInput;
                if (index >= session.machineRecords.length) return;
                const currentVal = session.machineRecords[index][field] || '';
                updateMachineRecord(index, field, currentVal.slice(0, -1));
            };

            const handleKeypadClear = () => {
                if (!activeInput) return;
                const { index, field } = activeInput;
                if (index >= session.machineRecords.length) return;
                updateMachineRecord(index, field, '');
            };

            const handleNextField = () => {
                if (!activeInput) {
                    setActiveInput({ index: 0, field: 'machineNo' });
                    return;
                }
                if (activeInput.field === 'machineNo') {
                    setActiveInput({ index: activeInput.index, field: 'bagNo' });
                } else {
                    if (activeInput.index < session.machineRecords.length - 1) {
                        setActiveInput({ index: activeInput.index + 1, field: 'machineNo' });
                    } else {
                        setActiveInput({ index: 0, field: 'machineNo' });
                    }
                }
            };

            const handleRecordSubmit = () => {
                const validRecords = session.machineRecords.filter(r => r.machineNo.trim() || r.bagNo.trim());
                const hasIncomplete = validRecords.some(r => !r.machineNo.trim() || !r.bagNo.trim());

                if (validRecords.length === 0) {
                    showToast('請最少填寫一組票機與票袋編號', 'error');
                    return;
                }
                if (hasIncomplete) {
                    showToast('請完整填寫已新增的機具資訊', 'error');
                    return;
                }

                setSession(prev => ({ ...prev, machineRecords: validRecords }));
                setCurrentView('checkout');
                showToast('請確認紀錄');
            };

            const handleClockOut = async () => {
                if (isSubmitting) return;
                setIsSubmitting(true);
                
                const clockOutTime = formatCustomDateTime(new Date());
                const baseTimestamp = Date.now();
                // WARNING: In a standalone file, this URL needs to be your actual deployed GAS Web App URL
                // If you don't have one, this will fail silently but local state will still update for admin view.
                const gasUrl = "https://script.google.com/macros/s/AKfycbw8aIYEBfTfeJpRrYBY6zazZbtUdnc6lI89LQGvXdmryxde8l9PsCzM2iRIGPykhtZ6/exec";

                let successCount = 0;
                let failCount = 0;

                for (let i = 0; i < session.machineRecords.length; i++) {
                    const mr = session.machineRecords[i];
                    
                    const payloadData = {
                        empNo: session.empNo,
                        clockInTime: session.clockInTime,
                        quizAttempts: 0, // Hardcoded to 0 as quiz is removed
                        machineNo: mr.machineNo,
                        bagNo: mr.bagNo,
                        clockOutTime: clockOutTime
                    };

                    const finalRecord = {
                        empNo: session.empNo,
                        clockInTime: session.clockInTime,
                        quizAttempts: 0,
                        machineRecords: [{ machineNo: mr.machineNo, bagNo: mr.bagNo }],
                        clockOutTime: clockOutTime,
                        timestamp: baseTimestamp + i
                    };

                    try {
                        await fetch(gasUrl, {
                            method: "POST",
                            mode: "no-cors",
                            headers: {
                                "Content-Type": "text/plain;charset=utf-8",
                            },
                            body: JSON.stringify(payloadData)
                        });
                        successCount++;
                    } catch (err) {
                        console.error("發送失敗:", err);
                        failCount++;
                    }
                    
                    // Add to local state so admin view works in this standalone version
                    setDbRecords(prev => [...prev, { ...finalRecord, id: (baseTimestamp + i).toString() }]);
                }

                setIsSubmitting(false);

                if (failCount === 0) {
                    showToast(`完成！已成功儲存！`);
                } else {
                    showToast(`完成！(背景發送失敗，但已儲存至本地)`, 'error');
                }
                
                setSession({
                    empNo: '',
                    clockInTime: null,
                    machineRecords: [{ machineNo: '', bagNo: '' }],
                    clockOutTime: null
                });
                setCurrentView('login');
            };

            const handleAdminLoginSubmit = () => {
                if (adminPassword === '3333') {
                    setIsAdminAuth(true);
                    setAdminPassword('');
                    setCurrentView('admin');
                    showToast('成功進入後台');
                } else {
                    showToast('密碼錯誤，請重新輸入', 'error');
                }
            };

            const exportToExcel = () => {
                if (!window.XLSX) {
                    showToast('導出組件加載中，請稍後再試', 'error');
                    return;
                }
                const ws = window.XLSX.utils.json_to_sheet(dbRecords.map(r => ({
                    '員工編號': r.empNo,
                    '開工時間': r.clockInTime,
                    '票機編號': r.machineRecords.map(m => m.machineNo).join(', '),
                    '票袋編號': r.machineRecords.map(m => m.bagNo).join(', '),
                    '完成時間': r.clockOutTime
                })));
                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, "打卡紀錄");
                window.XLSX.writeFile(wb, `員工打卡紀錄_${new Date().toLocaleDateString()}.xlsx`);
                showToast('Excel 下載成功');
            };

            const copyToTSV = () => {
                const headers = ['員工編號', '開工時間', '票機編號', '票袋編號', '完成時間'];
                const rows = dbRecords.map(r => 
                    [
                        r.empNo, 
                        r.clockInTime, 
                        r.machineRecords.map(m => m.machineNo).join(', '), 
                        r.machineRecords.map(m => m.bagNo).join(', '), 
                        r.clockOutTime
                    ].join('\t')
                );
                const tsvContent = [headers.join('\t'), ...rows].join('\n');

                const textArea = document.createElement("textarea");
                textArea.value = tsvContent;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('已複製為 Google Sheets 格式 (TSV)');
                } catch (err) {
                    showToast('複製失敗，請手動選取', 'error');
                }
                document.body.removeChild(textArea);
            };

            const renderLogin = () => (
                <div className="flex flex-col items-center justify-center animate-fade-in-up pt-6">
                    <KexLogo />
                    <h2 className="text-2xl font-bold text-zinc-800 mb-2">CQM員工打卡系統</h2>
                    <p className="text-zinc-500 mb-8 text-center">請輸入您的員工編號以開始今日的工作流程</p>
                    
                    <input 
                        type="text" 
                        placeholder="例如: EMP-001"
                        value={session.empNo}
                        onChange={(e) => setSession(prev => ({ ...prev, empNo: e.target.value }))}
                        onKeyDown={(e) => e.key === 'Enter' && handleClockIn()}
                        className="w-full text-center text-xl bg-zinc-50 border-2 border-zinc-200 rounded-[2rem] px-6 py-4 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-100 transition-all mb-6"
                    />
                    
                    <button 
                        onClick={handleClockIn}
                        className="w-full bg-orange-500 hover:bg-orange-600 text-white rounded-[2rem] px-6 py-4 font-bold text-lg shadow-sm transition-all duration-300 transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2"
                    >
                        <IconPlay size={24} /> 開工打卡
                    </button>
                </div>
            );

            const renderRecord = () => {
                const addMachineRecord = () => {
                    if (session.machineRecords.length < 4) {
                        setSession(prev => ({
                            ...prev,
                            machineRecords: [...prev.machineRecords, { machineNo: '', bagNo: '' }]
                        }));
                    }
                };

                const removeMachineRecord = (indexToRemove) => {
                    setSession(prev => ({
                        ...prev,
                        machineRecords: prev.machineRecords.filter((_, idx) => idx !== indexToRemove)
                    }));
                    if (activeInput && activeInput.index >= session.machineRecords.length - 1) {
                        setActiveInput({ index: 0, field: 'machineNo' });
                    }
                };

                const allowedLetters = ['A', 'B', 'C', 'D', 'E', 'F', 'H', 'K', 'N', 'S'];

                const getFieldLabel = () => {
                    if (!activeInput) return '未選擇輸入框 (請點擊上方欄位)';
                    const targetName = activeInput.field === 'machineNo' ? 'CQM 機號' : '票袋編號';
                    return `第 ${activeInput.index + 1} 組 : ${targetName}`;
                };

                return (
                    <div className="flex flex-col animate-fade-in-up">
                        <div className="flex items-center gap-3 mb-6">
                            <div className="bg-orange-100 p-3 rounded-full text-orange-600">
                                <IconClipboardList size={24} />
                            </div>
                            <div>
                                <h2 className="text-xl font-bold text-zinc-800">CQM紀錄</h2>
                                <p className="text-sm text-zinc-500">請填寫目前處理的開票機資訊 (最多 4 組)</p>
                            </div>
                        </div>

                        <div className="space-y-4 mb-4">
                            {session.machineRecords.map((mr, idx) => {
                                const isMachineActive = activeInput?.index === idx && activeInput?.field === 'machineNo';
                                const isBagActive = activeInput?.index === idx && activeInput?.field === 'bagNo';

                                return (
                                    <div key={idx} className="bg-zinc-50 border border-zinc-200 rounded-[1.5rem] p-5 relative">
                                        {session.machineRecords.length > 1 && (
                                            <button 
                                                onClick={() => removeMachineRecord(idx)} 
                                                className="absolute top-4 right-4 text-zinc-400 hover:text-red-500 transition-colors"
                                                title="移除此組紀錄"
                                            >
                                                <IconXCircle size={20} />
                                            </button>
                                        )}
                                        <h4 className="text-xs font-bold text-zinc-400 mb-3 uppercase tracking-wider">機具組 {idx + 1}</h4>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-medium text-zinc-600 mb-1.5 ml-1">開票機 (CQM) 編號</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="例如 CQM-8821"
                                                    value={mr.machineNo}
                                                    onFocus={() => setActiveInput({ index: idx, field: 'machineNo' })}
                                                    onClick={() => setActiveInput({ index: idx, field: 'machineNo' })}
                                                    onChange={(e) => updateMachineRecord(idx, 'machineNo', e.target.value)}
                                                    className={`w-full bg-white border-2 rounded-xl px-3 py-2.5 text-sm font-semibold tracking-wide transition-all outline-none ${
                                                        isMachineActive 
                                                            ? 'border-orange-500 ring-4 ring-orange-100 bg-orange-50/20 text-orange-900' 
                                                            : 'border-zinc-200 text-zinc-800 hover:border-zinc-300'
                                                    }`}
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-zinc-600 mb-1.5 ml-1">票袋編號</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="例如 BAG-0943"
                                                    value={mr.bagNo}
                                                    onFocus={() => setActiveInput({ index: idx, field: 'bagNo' })}
                                                    onClick={() => setActiveInput({ index: idx, field: 'bagNo' })}
                                                    onChange={(e) => updateMachineRecord(idx, 'bagNo', e.target.value)}
                                                    className={`w-full bg-white border-2 rounded-xl px-3 py-2.5 text-sm font-semibold tracking-wide transition-all outline-none ${
                                                        isBagActive 
                                                            ? 'border-orange-500 ring-4 ring-orange-100 bg-orange-50/20 text-orange-900' 
                                                            : 'border-zinc-200 text-zinc-800 hover:border-zinc-300'
                                                    }`}
                                                />
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {session.machineRecords.length < 4 && (
                            <button 
                                onClick={addMachineRecord}
                                className="w-full bg-orange-50 text-orange-600 border-2 border-dashed border-orange-200 hover:bg-orange-100 hover:border-orange-300 rounded-[1.2rem] py-3 font-bold text-sm transition-all mb-4 flex items-center justify-center gap-2"
                            >
                                <IconPlus size={18} /> 新增一組機具
                            </button>
                        )}

                        <div className="bg-zinc-200 p-3.5 sm:p-4 rounded-3xl shadow-md mb-6 border-2 border-zinc-300 select-none">
                            <div className="flex items-center justify-between mb-3 bg-zinc-500 px-3.5 py-1.5 rounded-2xl text-white text-xs">
                                <div className="flex items-center gap-2 truncate">
                                    <span className="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                                    <span className="font-medium truncate">{getFieldLabel()}</span>
                                </div>
                                <button 
                                    onClick={handleNextField}
                                    type="button"
                                    className="px-2.5 py-1 bg-white/20 hover:bg-white/30 rounded-xl text-white font-semibold text-xs transition active:scale-95 shrink-0"
                                >
                                    下一欄 ➔
                                </button>
                            </div>

                            <div className="grid grid-cols-5 gap-2 sm:gap-3">
                                <div className="col-span-3 grid grid-cols-3 gap-2">
                                    {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((num) => (
                                        <button
                                            key={num}
                                            type="button"
                                            onClick={() => handleKeypadPress(num)}
                                            className="h-11 sm:h-13 bg-white rounded-2xl shadow-md text-zinc-800 text-xl font-bold flex items-center justify-center hover:bg-zinc-100 active:scale-95 transition-all"
                                        >
                                            {num}
                                        </button>
                                    ))}
                                    <button
                                        type="button"
                                        onClick={handleKeypadClear}
                                        className="h-11 sm:h-13 bg-white rounded-2xl shadow-md flex items-center justify-center hover:bg-red-50 active:scale-95 transition-all group"
                                        title="清空"
                                    >
                                        <div className="w-6 h-6 rounded-full bg-slate-200/80 flex items-center justify-center text-slate-500 font-black text-xs group-hover:bg-red-100 group-hover:text-red-500">
                                            ✕
                                        </div>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => handleKeypadPress('0')}
                                        className="h-11 sm:h-13 bg-white rounded-2xl shadow-md text-zinc-800 text-xl font-bold flex items-center justify-center hover:bg-zinc-100 active:scale-95 transition-all"
                                    >
                                        0
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleKeypadBackspace}
                                        className="h-11 sm:h-13 bg-white rounded-2xl shadow-md flex items-center justify-center hover:bg-amber-50 active:scale-95 transition-all group"
                                        title="刪除"
                                    >
                                        <div className="w-6 h-6 rounded-full bg-slate-200/80 flex items-center justify-center text-slate-500 font-bold text-sm group-hover:bg-amber-100 group-hover:text-amber-600">
                                            ←
                                        </div>
                                    </button>
                                </div>

                                <div className="col-span-2 flex flex-col justify-between px-0.5">
                                    <div className="text-center text-zinc-400 text-[10px] leading-none mb-0.5">▲</div>
                                    <div className="grid grid-cols-2 gap-2 my-auto">
                                        {allowedLetters.map((lettr) => (
                                            <button
                                                key={lettr}
                                                type="button"
                                                onClick={() => handleKeypadPress(lettr)}
                                                className="aspect-square bg-white rounded-full shadow-md text-zinc-800 text-lg font-bold flex items-center justify-center hover:bg-zinc-100 active:scale-95 transition-all"
                                            >
                                                {lettr}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="text-center text-zinc-400 text-[10px] leading-none mt-0.5">▼</div>
                                </div>
                            </div>
                        </div>

                        <button 
                            onClick={handleRecordSubmit}
                            className="w-full bg-orange-500 hover:bg-orange-600 text-white rounded-[2rem] px-6 py-4 font-bold text-lg shadow-sm transition-all duration-300 transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2"
                        >
                            <IconCheckSquare size={24} /> 儲存紀錄
                        </button>
                    </div>
                );
            };

            const renderCheckout = () => (
                <div className="flex flex-col items-center justify-center animate-fade-in-up text-center pt-8">
                    <div className={`w-24 h-24 rounded-full flex items-center justify-center mb-6 shadow-sm ${isSubmitting ? 'bg-orange-100 text-orange-500' : 'bg-green-100 text-green-500'}`}>
                        {isSubmitting ? (
                            <IconLoader2 size={48} className="animate-spin text-orange-500" />
                        ) : (
                            <IconCheckCircle2 size={48} />
                        )}
                    </div>
                    
                    <h2 className="text-2xl font-bold text-zinc-800 mb-2">
                        {isSubmitting ? '紀錄中...' : '確認紀錄'}
                    </h2>
                    <p className="text-zinc-500 mb-8 max-w-xs">
                        {isSubmitting ? '正在將您的打卡資料上傳至雲端，請稍候...' : '確認無誤後請點擊完成儲存紀錄'}
                    </p>

                    <div className="bg-zinc-50 rounded-[2rem] p-6 w-full mb-8 text-left border border-zinc-200">
                        <p className="text-sm text-zinc-500 mb-1">目前員工</p>
                        <p className="font-semibold text-zinc-800 mb-4">{session.empNo}</p>
                        
                        <div className="space-y-3 pt-2 border-t border-zinc-200">
                            {session.machineRecords.map((mr, idx) => (
                                <div key={idx} className="grid grid-cols-2 gap-4 pb-3 border-b border-zinc-100 last:border-0 last:pb-0">
                                    <div>
                                        <p className="text-xs text-zinc-400 mb-1 uppercase">票機 {idx + 1}</p>
                                        <p className="font-medium text-zinc-800 break-words">{mr.machineNo || '-'}</p>
                                    </div>
                                    <div>
                                        <p className="text-xs text-zinc-400 mb-1 uppercase">票袋 {idx + 1}</p>
                                        <p className="font-medium text-zinc-800 break-words">{mr.bagNo || '-'}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    <button 
                        onClick={handleClockOut}
                        disabled={isSubmitting}
                        className="w-full bg-zinc-800 hover:bg-zinc-900 disabled:bg-zinc-400 text-white rounded-[2rem] px-6 py-4 font-bold text-lg shadow-sm transition-all duration-300 transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2"
                    >
                        {isSubmitting ? (
                            <>
                                <IconLoader2 size={24} className="animate-spin" />
                                <span>紀錄中...</span>
                            </>
                        ) : (
                            <>
                                <IconCheckCircle2 size={24} />
                                <span>完成</span>
                            </>
                        )}
                    </button>
                </div>
            );

            const renderAdminLogin = () => (
                <div className="flex flex-col items-center justify-center animate-fade-in-up pt-6">
                    <div className="w-20 h-20 bg-zinc-800 text-white rounded-full flex items-center justify-center mb-6 shadow-sm">
                        <IconLock size={32} />
                    </div>
                    <h2 className="text-2xl font-bold text-zinc-800 mb-2">管理員登入</h2>
                    <p className="text-zinc-500 mb-8 text-center">請輸入管理員密碼以進入一體化後台</p>
                    
                    <input 
                        type="password" 
                        placeholder="請輸入密碼"
                        value={adminPassword}
                        onChange={(e) => setAdminPassword(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && handleAdminLoginSubmit()}
                        className="w-full text-center text-xl bg-zinc-50 border-2 border-zinc-200 rounded-[2rem] px-6 py-4 focus:outline-none focus:border-zinc-800 focus:ring-4 focus:ring-zinc-100 transition-all mb-6 tracking-widest"
                    />
                    
                    <button 
                        onClick={handleAdminLoginSubmit}
                        className="w-full bg-zinc-800 hover:bg-zinc-900 text-white rounded-[2rem] px-6 py-4 font-bold text-lg shadow-sm transition-all duration-300 transform hover:scale-[1.02] active:scale-95"
                    >
                        進入後台
                    </button>
                </div>
            );

            const renderAdmin = () => (
                <div className="flex flex-col animate-fade-in-up h-full max-w-4xl mx-auto">
                    <div className="bg-white rounded-[2rem] shadow-sm border border-zinc-200 overflow-hidden flex flex-col">
                        <div className="p-6 border-b border-zinc-100 flex flex-wrap items-center justify-between gap-4 bg-zinc-50">
                            <h3 className="font-bold text-zinc-800 text-lg flex items-center gap-2">
                                <IconClipboardList className="text-orange-500" /> 本機數據總覽 (非同步)
                            </h3>
                            <div className="flex gap-2">
                                <button onClick={copyToTSV} className="flex items-center gap-2 px-4 py-2 bg-blue-100 text-blue-700 rounded-xl hover:bg-blue-200 transition-colors text-sm font-medium">
                                    <IconCopy size={16} /> 複製
                                </button>
                                <button onClick={exportToExcel} className="flex items-center gap-2 px-4 py-2 bg-green-100 text-green-700 rounded-xl hover:bg-green-200 transition-colors text-sm font-medium">
                                    <IconDownload size={16} /> 匯出
                                </button>
                            </div>
                        </div>

                        <div className="p-6 overflow-x-auto">
                            {dbRecords.length === 0 ? (
                                <div className="py-12 flex flex-col items-center justify-center text-zinc-400">
                                    <IconFileSpreadsheet size={48} className="mb-4 opacity-50" />
                                    <p>目前尚無任何本機打卡數據</p>
                                </div>
                            ) : (
                                <table className="w-full border-separate border-spacing-0 text-left min-w-[800px]">
                                    <thead>
                                        <tr>
                                            <th className="p-3 border-b-2 border-zinc-200 text-zinc-500 font-medium text-sm rounded-tl-[1rem]">員工編號</th>
                                            <th className="p-3 border-b-2 border-zinc-200 text-zinc-500 font-medium text-sm">開工時間</th>
                                            <th className="p-3 border-b-2 border-zinc-200 text-zinc-500 font-medium text-sm">票機編號</th>
                                            <th className="p-3 border-b-2 border-zinc-200 text-zinc-500 font-medium text-sm">票袋編號</th>
                                            <th className="p-3 border-b-2 border-zinc-200 text-zinc-500 font-medium text-sm rounded-tr-[1rem]">完成時間</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {dbRecords.map((record, index) => (
                                            <tr key={record.id} className="hover:bg-zinc-50 transition-colors align-top">
                                                <td className={`p-2 border-b border-zinc-100 ${index === dbRecords.length - 1 ? 'rounded-bl-[1rem]' : ''}`}>
                                                    <div className="px-2 py-1 mt-1 text-sm text-zinc-800 font-medium whitespace-nowrap">{record.empNo}</div>
                                                </td>
                                                <td className="p-3 border-b border-zinc-100 text-sm text-zinc-600 whitespace-nowrap">{record.clockInTime}</td>
                                                <td className="p-2 border-b border-zinc-100 min-w-[120px]">
                                                    {record.machineRecords.map((mr, mIdx) => (
                                                        <div key={mIdx} className="px-2 py-1 mb-1 text-xs text-zinc-600 bg-white rounded border border-zinc-100 shadow-sm truncate">
                                                            {mr.machineNo || '-'}
                                                        </div>
                                                    ))}
                                                </td>
                                                <td className="p-2 border-b border-zinc-100 min-w-[120px]">
                                                    {record.machineRecords.map((mr, mIdx) => (
                                                        <div key={mIdx} className="px-2 py-1 mb-1 text-xs text-zinc-600 bg-white rounded border border-zinc-100 shadow-sm truncate">
                                                            {mr.bagNo || '-'}
                                                        </div>
                                                    ))}
                                                </td>
                                                <td className={`p-3 border-b border-zinc-100 text-sm text-zinc-600 whitespace-nowrap ${index === dbRecords.length - 1 ? 'rounded-br-[1rem]' : ''}`}>
                                                    {record.clockOutTime}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-zinc-100 font-sans text-zinc-900 pb-20 selection:bg-orange-200">
                    <header className="bg-zinc-600 text-white p-4 shadow-md rounded-b-[2rem] sm:rounded-b-[3rem] sticky top-0 z-10 transition-all">
                        <div className="max-w-4xl mx-auto flex items-center justify-between px-2">
                            <div className="flex items-center gap-3">
                                <div className="bg-white/10 p-2 rounded-xl backdrop-blur-sm">
                                    <IconFileSpreadsheet className="text-orange-400" size={28} />
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight tracking-wide">CQM員工打卡系統</h1>
                                    <span className="text-xs text-zinc-300 font-mono">v3.0 CQM</span>
                                </div>
                            </div>
                            
                            <div className="flex gap-2">
                                {currentView !== 'login' && currentView !== 'admin' && currentView !== 'adminLogin' && (
                                    <button 
                                        onClick={() => setCurrentView('login')} 
                                        className="p-2 hover:bg-white/10 rounded-full transition-colors"
                                        title="返回首頁"
                                    >
                                        <IconHome size={22} className="text-zinc-300 hover:text-white" />
                                    </button>
                                )}
                                <button 
                                    onClick={() => {
                                        if (currentView === 'admin' || currentView === 'adminLogin') {
                                            setCurrentView('login');
                                        } else {
                                            setCurrentView(isAdminAuth ? 'admin' : 'adminLogin');
                                        }
                                    }}
                                    className={`p-2 rounded-full transition-colors ${
                                        (currentView === 'admin' || currentView === 'adminLogin') ? 'bg-orange-500 text-white' : 'hover:bg-white/10 text-zinc-300 hover:text-white'
                                    }`}
                                    title="管理員後台"
                                >
                                    <IconSettings size={22} />
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className={`p-4 sm:p-6 mt-4 sm:mt-8 mx-auto transition-all duration-500 ease-out ${currentView === 'admin' ? 'max-w-5xl' : 'max-w-md'}`}>
                        <div className="bg-white rounded-[2rem] sm:rounded-[2.5rem] shadow-sm border border-zinc-100 p-6 sm:p-10 min-h-[400px]">
                            {currentView === 'login' && renderLogin()}
                            {currentView === 'record' && renderRecord()}
                            {currentView === 'checkout' && renderCheckout()}
                            {currentView === 'adminLogin' && renderAdminLogin()}
                            {currentView === 'admin' && renderAdmin()}
                        </div>
                    </main>

                    <div 
                        className={`fixed bottom-6 left-1/2 transform -translate-x-1/2 transition-all duration-300 z-50 ${
                            toast.visible ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0 pointer-events-none'
                        }`}
                    >
                        <div className={`flex items-center gap-2 px-6 py-3 rounded-full shadow-lg text-white font-medium ${
                            toast.type === 'error' ? 'bg-red-500' : 'bg-zinc-800'
                        }`}>
                            {toast.type === 'error' ? <IconXCircle size={18} /> : <IconCheckCircle2 size={18} />}
                            {toast.msg}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
