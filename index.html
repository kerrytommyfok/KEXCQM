<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CQM員工打卡系統</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f4f5;
      color: #18181b;
      padding-bottom: 2rem;
    }

    ::selection {
      background: #fed7aa;
    }

    button,
    input {
      font-family: inherit;
    }

    .app {
      min-height: 100vh;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #52525b;
      color: #fff;
      padding: 1rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      border-bottom-left-radius: 2rem;
      border-bottom-right-radius: 2rem;
    }

    @media (min-width: 640px) {
      .header {
        border-bottom-left-radius: 3rem;
        border-bottom-right-radius: 3rem;
      }
    }

    .header-inner {
      max-width: 56rem;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.5rem;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-icon {
      background: rgb(255 255 255 / 0.1);
      padding: 0.5rem;
      border-radius: 0.75rem;
    }

    .header h1 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.25;
      letter-spacing: 0.025em;
    }

    .version {
      font-size: 0.75rem;
      color: #d4d4d8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    .icon-btn {
      background: transparent;
      border: 0;
      color: #d4d4d8;
      padding: 0.5rem;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: rgb(255 255 255 / 0.1);
      color: #fff;
    }

    .icon-btn.active {
      background: #f97316;
      color: #fff;
    }

    .main {
      margin: 0.5rem auto 0;
      padding: 0.5rem;
      transition: max-width 0.5s ease-out;
    }

    @media (min-width: 640px) {
      .main {
        margin-top: 2rem;
        padding: 1.5rem;
      }
    }

    .main-narrow {
      max-width: 28rem;
    }

    .main-wide {
      max-width: 64rem;
    }

    .card {
      background: #fff;
      border: 1px solid #f4f4f5;
      border-radius: 1.5rem;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      padding: 1rem;
    }

    @media (min-width: 640px) {
      .card {
        border-radius: 2.5rem;
        padding: 2.5rem;
      }
    }

    .fade-up {
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 1.5rem;
    }

    .stack {
      display: flex;
      flex-direction: column;
    }

    .logo {
      width: 10rem;
      height: auto;
      margin: 0 auto 1rem;
      display: block;
      filter: drop-shadow(0 1px 1px rgb(0 0 0 / 0.05));
    }

    h2 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      color: #27272a;
    }

    h2.section-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .muted {
      color: #71717a;
      margin: 0 0 1rem;
      text-align: center;
      font-size: 0.875rem;
    }

    .muted-sm {
      margin: 0;
      font-size: 0.75rem;
      color: #71717a;
    }

    .full-input {
      width: 100%;
      text-align: center;
      font-size: 1rem;
      background: #fafafa;
      border: 2px solid #e4e4e7;
      border-radius: 1.5rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      outline: none;
    }

    .full-input:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 4px #ffedd5;
    }

    .full-input.admin {
      letter-spacing: 0.2em;
    }

    .full-input.admin:focus {
      border-color: #27272a;
      box-shadow: 0 0 0 4px #f4f4f5;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 1.5rem;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      transition: transform 0.2s, background 0.2s;
    }

    .btn:hover:not(:disabled) {
      transform: scale(1.02);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .btn:disabled {
      cursor: not-allowed;
      background: #a1a1aa;
    }

    .btn-orange {
      background: #f97316;
      color: #fff;
    }

    .btn-orange:hover:not(:disabled) {
      background: #ea580c;
    }

    .btn-dark {
      background: #27272a;
      color: #fff;
    }

    .btn-dark:hover:not(:disabled) {
      background: #18181b;
    }

    .btn-dashed {
      background: #fff7ed;
      color: #ea580c;
      border: 2px dashed #fed7aa;
      border-radius: 1.2rem;
      padding: 0.6rem;
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
    }

    .btn-dashed:hover {
      background: #ffedd5;
      border-color: #fdba74;
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .icon-circle {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-circle svg {
      width: 20px;
      height: 20px;
    }

    .icon-circle.zinc {
      background: #f4f4f5;
      color: #52525b;
    }

    .icon-circle.orange {
      background: #ffedd5;
      color: #ea580c;
    }

    .icon-circle.green {
      width: 4rem;
      height: 4rem;
      background: #dcfce7;
      color: #22c55e;
      margin-bottom: 1rem;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
    }

    .icon-circle.green svg {
      width: 32px;
      height: 32px;
    }

    .icon-circle.lock {
      width: 4rem;
      height: 4rem;
      background: #27272a;
      color: #fff;
      margin-bottom: 1rem;
    }

    .icon-circle.lock svg {
      width: 24px;
      height: 24px;
    }

    .quiz-box {
      background: #fafafa;
      border: 1px solid #e4e4e7;
      border-radius: 1.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .quiz-text {
      font-size: 1.25rem;
      font-weight: 600;
      color: #27272a;
      margin: 0 0 1rem;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .option {
      width: 100%;
      text-align: left;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      border: 2px solid #e4e4e7;
      background: #fff;
      color: #52525b;
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1.4;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      box-sizing: border-box;
    }

    .option:hover {
      border-color: #fdba74;
    }

    .option.selected {
      border-color: #f97316;
      background: #fff7ed;
      color: #c2410c;
      font-weight: 500;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
    }

    .radio-dot {
      width: 1.25rem;
      height: 1.25rem;
      flex-shrink: 0;
      border-radius: 9999px;
      border: 2px solid #d4d4d8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option.selected .radio-dot {
      border-color: #f97316;
    }

    .radio-dot span {
      width: 0.6rem;
      height: 0.6rem;
      background: #f97316;
      border-radius: 9999px;
    }

    .machine-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .machine-card {
      background: #fafafa;
      border: 1px solid #e4e4e7;
      border-radius: 1rem;
      padding: 0.75rem;
      position: relative;
    }

    .remove-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: transparent;
      border: 0;
      color: #a1a1aa;
      cursor: pointer;
      padding: 0;
    }

    .remove-btn:hover {
      color: #ef4444;
    }

    .machine-label {
      margin: 0 0 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: #a1a1aa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .field-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      color: #52525b;
      margin: 0 0 0.25rem 0.25rem;
    }

    .field-input {
      width: 100%;
      background: #fff;
      border: 2px solid #e4e4e7;
      border-radius: 0.5rem;
      padding: 0.4rem 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #27272a;
      outline: none;
      cursor: pointer;
      caret-color: transparent;
    }

    .field-input:hover {
      border-color: #d4d4d8;
    }

    .field-input.active {
      border-color: #f97316;
      box-shadow: 0 0 0 4px #ffedd5;
      background: rgb(255 247 237 / 0.2);
      color: #7c2d12;
    }

    .keypad {
      background: #f97316;
      padding: 0.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      margin-bottom: 1rem;
      border: 2px solid #ea580c;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .keypad-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      background: #ea580c;
      padding: 0.375rem 0.875rem;
      border-radius: 1rem;
      color: #fff;
      font-size: 0.75rem;
    }

    .keypad-bar-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }

    .pulse-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
      background: #fff;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.45;
      }
    }

    .truncate {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .next-field {
      flex-shrink: 0;
      padding: 0.25rem 0.625rem;
      background: rgb(255 255 255 / 0.2);
      border: 0;
      border-radius: 0.75rem;
      color: #fff;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .next-field:hover {
      background: rgb(255 255 255 / 0.3);
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 0.5rem;
    }

    .num-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .key {
      height: 2.25rem;
      background: #fff;
      border: 0;
      border-radius: 0.5rem;
      box-shadow: 0 2px 4px -1px rgb(0 0 0 / 0.1);
      color: #27272a;
      font-size: 1.125rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .key:hover {
      background: #f4f4f5;
    }

    .key:active {
      transform: scale(0.95);
    }

    .key-mini {
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 9999px;
      background: rgb(226 232 240 / 0.8);
      color: #64748b;
      font-size: 0.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .letters {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .letters-hint {
      text-align: center;
      color: rgb(255 255 255 / 0.7);
      font-size: 10px;
      line-height: 1;
    }

    .letter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
      margin: auto 0;
    }

    .letter {
      aspect-ratio: 1;
      background: #fff;
      border: 0;
      border-radius: 9999px;
      box-shadow: 0 2px 4px -1px rgb(0 0 0 / 0.1);
      color: #27272a;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .letter:hover {
      background: #f4f4f5;
    }

    .letter:active {
      transform: scale(0.95);
    }

    .checkout {
      text-align: center;
      padding-top: 2rem;
    }

    .spin {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .summary {
      background: #fafafa;
      border: 1px solid #e4e4e7;
      border-radius: 2rem;
      padding: 1.5rem;
      width: 100%;
      margin-bottom: 2rem;
      text-align: left;
    }

    .summary .label {
      font-size: 0.875rem;
      color: #71717a;
      margin: 0 0 0.25rem;
    }

    .summary .value {
      font-weight: 600;
      color: #27272a;
      margin: 0 0 1rem;
    }

    .summary-rows {
      border-top: 1px solid #e4e4e7;
      padding-top: 0.5rem;
    }

    .summary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding-bottom: 0.75rem;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid #f4f4f5;
    }

    .summary-row:last-child {
      border-bottom: 0;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .tiny {
      font-size: 0.75rem;
      color: #a1a1aa;
      margin: 0 0 0.25rem;
      text-transform: uppercase;
    }

    .break {
      font-weight: 500;
      color: #27272a;
      margin: 0;
      word-break: break-word;
    }

    .admin-wrap {
      max-width: 56rem;
      margin: 0 auto;
    }

    .tabs {
      display: flex;
      padding: 0.25rem;
      background: #f4f4f5;
      border-radius: 2rem;
      margin: 0 auto 1.5rem;
      width: 100%;
      max-width: 28rem;
    }

    .tab {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 0.75rem 1rem;
      border-radius: 1.5rem;
      font-weight: 500;
      font-size: 0.875rem;
      color: #71717a;
      cursor: pointer;
    }

    .tab.active {
      background: #fff;
      color: #27272a;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
    }

    .panel {
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 2rem;
      overflow: hidden;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
    }

    .panel-head {
      padding: 1.5rem;
      border-bottom: 1px solid #f4f4f5;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: #fafafa;
    }

    .panel-title {
      margin: 0;
      font-size: 1.125rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border: 0;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }

    .chip:disabled {
      opacity: 0.5;
    }

    .chip-purple {
      background: #f3e8ff;
      color: #7e22ce;
    }

    .chip-blue {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .chip-green {
      background: #dcfce7;
      color: #15803d;
    }

    .ai-report {
      margin: 1.5rem;
      padding: 1rem;
      background: #faf5ff;
      border: 1px solid #f3e8ff;
      border-radius: 1.5rem;
      color: #6b21a8;
      font-size: 0.875rem;
      white-space: pre-line;
      line-height: 1.625;
    }

    .table-wrap {
      padding: 1.5rem;
      overflow-x: auto;
    }

    .empty {
      padding: 3rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #a1a1aa;
    }

    .data-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: left;
      min-width: 800px;
    }

    .data-table th {
      padding: 0.75rem;
      border-bottom: 2px solid #e4e4e7;
      color: #71717a;
      font-weight: 500;
      font-size: 0.875rem;
    }

    .data-table td {
      padding: 0.75rem;
      border-bottom: 1px solid #f4f4f5;
      font-size: 0.875rem;
      color: #52525b;
      vertical-align: top;
    }

    .data-table tbody tr:hover {
      background: #fafafa;
    }

    .pill {
      padding: 0.25rem 0.5rem;
      margin-bottom: 0.25rem;
      font-size: 0.75rem;
      color: #52525b;
      background: #fff;
      border: 1px solid #f4f4f5;
      border-radius: 0.25rem;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .q-panel {
      padding: 1.5rem;
    }

    .q-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      gap: 0.75rem;
    }

    .q-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .q-card {
      padding: 1.25rem;
      background: #fafafa;
      border: 1px solid #e4e4e7;
      border-radius: 1.5rem;
      position: relative;
    }

    .q-title-input {
      width: 100%;
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      outline: none;
    }

    .q-title-input:focus {
      border-color: #f97316;
    }

    .opt-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    @media (min-width: 640px) {
      .opt-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .opt-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .opt-input {
      flex: 1;
      height: 2.5rem;
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 0.5rem;
      padding: 0.375rem 0.75rem;
      outline: none;
      box-sizing: border-box;
    }

    .opt-input.correct {
      border-color: #fb923c;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(2.5rem);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: all 0.3s;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-inner {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      color: #fff;
      font-weight: 500;
    }

    .toast-inner.ok {
      background: #27272a;
    }

    .toast-inner.err {
      background: #ef4444;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <div class="header-brand">
          <div class="header-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      const state = {

      let firebaseReady = false;

      function emptySession() {
        return {
          empNo: "",
          clockInTime: null,
          quizAttempts: 0,
          quizPassed: false,
          machineRecords: [{ machineNo: "", bagNo: "" }],
          clockOutTime: null
        };
      }

      function loadLocalRecords() {
        try {
          return JSON.parse(localStorage.getItem(LOCAL_RECORDS_KEY) || "[]");
        } catch {
          return [];
        }
      }

      function saveLocalRecords() {
        localStorage.setItem(LOCAL_RECORDS_KEY, JSON.stringify(state.dbRecords));
      }

      function formatCustomDateTime(dateInput) {
        const d = new Date(dateInput == null ? Date.now() : dateInput);
        if (isNaN(d.getTime())) return typeof dateInput === "string" ? dateInput : "";
        const day = String(d.getDate()).padStart(2, "0");
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const year = d.getFullYear();
        let hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, "0");
        const seconds = String(d.getSeconds()).padStart(2, "0");
        const ampm = hours >= 12 ? "PM" : "AM";
        hours = hours % 12;
        hours = hours ? hours : 12;
        const strHours = String(hours).padStart(2, "0");
        return `${day}/${month}/${year}, ${strHours}:${minutes}:${seconds} ${ampm}`;
      }

      function showToast(msg, type) {
        type = type || "success";
        toastMsg.textContent = msg;
        toastInner.className = "toast-inner " + (type === "error" ? "err" : "ok");
        toastIcon.innerHTML = type === "error" ? icons.xCircleToast : icons.checkToast;
        toastEl.hidden = false;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove("show");
        }, 3000);
      }

      function initFirebase() {
        let config = {};
        try {
          if (typeof window.__firebase_config !== "undefined" && window.__firebase_config) {
            config = typeof window.__firebase_config === "string"
              ? JSON.parse(window.__firebase_config)
              : window.__firebase_config;
          }
        } catch (e) {
          config = {};
        }
        if (typeof window.__app_id !== "undefined" && window.__app_id) {
          appId = window.__app_id;
        }
        if (!config || !config.apiKey || typeof firebase === "undefined") return;

        try {
          firebase.initializeApp(config);
          const auth = firebase.auth();
          firestoreDb = firebase.firestore();
          firebaseReady = true;

          const token = window.__initial_auth_token;
          const start = token
            ? auth.signInWithCustomToken(token)
            : auth.signInAnonymously();

          start.catch(function (err) {
            console.error(err);
          });

          auth.onAuthStateChanged(function (user) {
            state.user = user;
            if (!user) return;
            firestoreDb
              .collection("artifacts")
              .doc(appId)
              .collection("public")
              .doc("data")
              .collection("attendance_records")
              .onSnapshot(
                function (snapshot) {
                  const data = snapshot.docs.map(function (doc) {
                    return Object.assign({ id: doc.id }, doc.data());
                  });
                  data.sort(function (a, b) {
                    return (a.timestamp || 0) - (b.timestamp || 0);
                  });
                  state.dbRecords = data;
                  if (state.currentView === "admin" && state.adminTab === "records") render();
                },
                function (error) {
                  console.error("Error fetching records:", error);
                  showToast("無法讀取雲端紀錄", "error");
                }
              );
          });
        } catch (err) {
          console.error(err);
          firebaseReady = false;
        }
      }

      function pickRandomQuestion(alreadyAsked) {
        const remaining = state.dbQuestions.filter(function (q) {
          return alreadyAsked.indexOf(q.id) === -1;
        });
        if (remaining.length === 0) {
          showToast("已嘗試所有題目且全部答錯！請重新打卡", "error");
          state.currentView = "login";
          render();
          return;
        }
        const randomIndex = Math.floor(Math.random() * remaining.length);
        state.currentQuestion = remaining[randomIndex];
        state.selectedOption = null;
      }

      function handleClockIn() {
        state.session.empNo = (state.session.empNo || "").replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
        if (!state.session.empNo.trim()) {
          showToast("請輸入有效的員工編號（只限英文與數字）", "error");
          return;
        }
        state.session.clockInTime = formatCustomDateTime(new Date());
        state.session.quizAttempts = 0;
        state.session.quizPassed = false;
        state.askedQuestionIds = [];
        pickRandomQuestion([]);
        state.currentView = "quiz";
        showToast("開工打卡成功！請完成測驗");
        render();
      }

      function updateMachineRecord(index, field, value) {
        const cleanVal = String(value || "").replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
        state.session.machineRecords[index][field] = cleanVal;
        const input = viewRoot.querySelector(`input[data-idx="${index}"][data-field="${field}"]`);
        if (input) {
          input.value = cleanVal;
        }
      }

      function handleKeypadPress(char) {
        const active = state.activeInput;
        if (!active || active.index >= state.session.machineRecords.length) return;
        const currentVal = state.session.machineRecords[active.index][active.field] || "";
        updateMachineRecord(active.index, active.field, currentVal + char);
      }

      function handleKeypadBackspace() {
        const active = state.activeInput;
        if (!active || active.index >= state.session.machineRecords.length) return;
        const currentVal = state.session.machineRecords[active.index][active.field] || "";
        updateMachineRecord(active.index, active.field, currentVal.slice(0, -1));
      }

      function handleKeypadClear() {
        const active = state.activeInput;
        if (!active || active.index >= state.session.machineRecords.length) return;
        updateMachineRecord(active.index, active.field, "");
      }

      function updateActiveFieldDOM() {
        viewRoot.querySelectorAll("[data-field]").forEach(function (el) {
          const on =
            Number(el.getAttribute("data-idx")) === state.activeInput.index &&
            el.getAttribute("data-field") === state.activeInput.field;
          el.classList.toggle("active", on);
        });
        const label = viewRoot.querySelector(".keypad-bar-left .truncate");
        if (label && state.activeInput) {
          const targetName = state.activeInput.field === "machineNo" ? "CQM 機號" : "票袋編號";
          label.textContent = "第 " + (state.activeInput.index + 1) + " 組 : " + targetName;
        }
      }

      function handleNextField() {
        if (!state.activeInput) {
          state.activeInput = { index: 0, field: "machineNo" };
        } else if (state.activeInput.field === "machineNo") {
          state.activeInput = { index: state.activeInput.index, field: "bagNo" };
        } else if (state.activeInput.index < state.session.machineRecords.length - 1) {
          state.activeInput = { index: state.activeInput.index + 1, field: "machineNo" };
        } else {
          state.activeInput = { index: 0, field: "machineNo" };
        }
        updateActiveFieldDOM();
      }

      function handleAnswerSubmit() {
        if (state.selectedOption === null) {
          showToast("請選擇一個答案", "error");
          return;
        }
        state.session.quizAttempts += 1;
        if (state.selectedOption === state.currentQuestion.correctIndex) {
          showToast("答對了！進入下一步");
          state.session.quizPassed = true;
          state.currentView = "record";
          render();
        } else {
          const newAsked = state.askedQuestionIds.concat(state.currentQuestion.id);
          state.askedQuestionIds = newAsked;
          const remainingCount = state.dbQuestions.length - newAsked.length;
          if (remainingCount > 0) {
            showToast("答錯了！已自動更換下一題 (剩餘 " + remainingCount + " 題)", "error");
            setTimeout(function () {
              pickRandomQuestion(newAsked);
              render();
            }, 1200);
          } else {
            showToast("已連續答錯全部 15 題！請重新打卡進行測試", "error");
            setTimeout(function () {
              state.currentView = "login";
              render();
            }, 2000);
          }
        }
      }

      function handleRecordSubmit() {
        const validRecords = state.session.machineRecords.map(function (r) {
          return {
            machineNo: (r.machineNo || "").replace(/[^a-zA-Z0-9]/g, "").toUpperCase(),
            bagNo: (r.bagNo || "").replace(/[^a-zA-Z0-9]/g, "").toUpperCase()
          };
        }).filter(function (r) {
          return r.machineNo.trim() || r.bagNo.trim();
        });
        const hasIncomplete = validRecords.some(function (r) {
          return !r.machineNo.trim() || !r.bagNo.trim();
        });
        if (validRecords.length === 0) {
          showToast("請最少填寫一組票機與票袋編號", "error");
          return;
        }
        if (hasIncomplete) {
          showToast("請完整填寫已新增的機具資訊", "error");
          return;
        }
        state.session.machineRecords = validRecords;
        state.currentView = "checkout";
        showToast("請確認紀錄");
        render();
      }

      async function handleClockOut() {
        if (state.isSubmitting) return;
        state.isSubmitting = true;
        render();

        const clockOutTime = formatCustomDateTime(new Date());
        const baseTimestamp = Date.now();
        let failCount = 0;

        for (let i = 0; i < state.session.machineRecords.length; i++) {
          const mr = state.session.machineRecords[i];
          const payloadData = {
            empNo: state.session.empNo,
            clockInTime: state.session.clockInTime,
            quizAttempts: state.session.quizAttempts,
            machineNo: mr.machineNo,
            bagNo: mr.bagNo,
            clockOutTime: clockOutTime
          };
          const finalRecord = {
            empNo: state.session.empNo,
            clockInTime: state.session.clockInTime,
            quizAttempts: state.session.quizAttempts,
            machineRecords: [{ machineNo: mr.machineNo, bagNo: mr.bagNo }],
            clockOutTime: clockOutTime,
            timestamp: baseTimestamp + i
          };

          try {
            await fetch(GAS_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify(payloadData)
            });
          } catch (err) {
            console.error("發送失敗:", err);
            failCount += 1;
          }

          if (firebaseReady && state.user && firestoreDb) {
            await firestoreDb
              .collection("artifacts")
              .doc(appId)
              .collection("public")
              .doc("data")
              .collection("attendance_records")
              .add(finalRecord);
          } else {
            state.dbRecords = state.dbRecords.concat([
              Object.assign({}, finalRecord, { id: String(baseTimestamp + i) })
            ]);
            saveLocalRecords();
          }
        }

        state.isSubmitting = false;
        if (failCount === 0) {
          showToast("完成！已成功將 " + state.session.machineRecords.length + " 筆獨立紀錄儲存！");
        } else {
          showToast("完成拆分紀錄 (有 " + failCount + " 筆同步失敗，但已儲存至系統)", "error");
        }
        state.session = emptySession();
        state.currentView = "login";
        render();
      }

      function exportToExcel() {
        if (!window.XLSX) {
          showToast("導出組件加載中，請稍後再試", "error");
          return;
        }
        const ws = window.XLSX.utils.json_to_sheet(
          state.dbRecords.map(function (r) {
            return {

              開工時間: formatCustomDateTime(r.clockInTime),

              完成時間: formatCustomDateTime(r.clockOutTime)
            };
          })
        );
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, "打卡紀錄");

      function copyToTSV() {
        const headers = ["員工編號", "開工時間", "答題嘗試次數", "票機編號", "票袋編號", "完成時間"];
        const rows = state.dbRecords.map(function (r) {
          return [
            r.empNo,
            formatCustomDateTime(r.clockInTime),
            r.quizAttempts,
            (r.machineRecords || []).map(function (m) { return m.machineNo; }).join(", "),
            (r.machineRecords || []).map(function (m) { return m.bagNo; }).join(", "),
            formatCustomDateTime(r.clockOutTime)
          ].join("\t");
        });
        const tsvContent = [headers.join("\t")].concat(rows).join("\n");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(tsvContent).then(function () {
            showToast("已複製為 Google Sheets 格式 (TSV)");
          }).catch(fallbackCopy);
        } else {
          fallbackCopy();
        }

        function fallbackCopy() {
          const textArea = document.createElement("textarea");
          textArea.value = tsvContent;
          document.body.appendChild(textArea);
          textArea.select();
          try {
            document.execCommand("copy");
            showToast("已複製為 Google Sheets 格式 (TSV)");
          } catch (err) {
            showToast("複製失敗，請手動選取", "error");
          }
          document.body.removeChild(textArea);
        }
      }

      function runAiAnalysis() {
        state.isAiAnalyzing = true;
        render();
        setTimeout(function () {
          const total = state.dbRecords.length;
          if (total === 0) {
            state.aiReport = "目前無足夠數據進行分析。";
          } else {
            const avgAttempts = (
              state.dbRecords.reduce(function (acc, curr) {
                return acc + (curr.quizAttempts || 0);
              }, 0) / total
            ).toFixed(1);
            const errorProne =
              avgAttempts > 1.5 ? "偏高，建議加強 CQM 基礎操作培訓" : "良好，員工普遍熟悉操作";
            state.aiReport =
              "【AI 分析報告】\n總打卡人次: " +
              total +
              " 次。\n平均答題嘗試次數: " +
              avgAttempts +
              " 次。\n操作熟悉度評估: " +
              errorProne +
              "。\n建議: 針對答錯重試超過 2 次的員工進行針對性指導。";
          }
          state.isAiAnalyzing = false;
          showToast("AI 分析完成");
          render();
        }, 2000);
      }

      function escapeHtml(str) {
        return String(str == null ? "" : str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeAttr(str) {
        return escapeHtml(str).replace(/'/g, "&#39;");
      }

      function render() {
        const view = state.currentView;
        mainEl.className = "main " + (view === "admin" ? "main-wide" : "main-narrow");

        else if (view === "quiz") viewRoot.innerHTML = renderQuiz();
        else if (view === "record") viewRoot.innerHTML = renderRecord();
        else if (view === "checkout") viewRoot.innerHTML = renderCheckout();
        else if (view === "adminLogin") viewRoot.innerHTML = renderAdminLogin();
        else if (view === "admin") viewRoot.innerHTML = renderAdmin();

        bindViewEvents();
      }

      function bindViewEvents() {
        const emp = document.getElementById("emp-no");
        if (emp) {
          emp.addEventListener("input", function (e) {
            const cleanVal = e.target.value.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
            state.session.empNo = cleanVal;
            const pos = e.target.selectionStart;
            e.target.value = cleanVal;
            if (typeof pos === "number") e.target.setSelectionRange(pos, pos);
          });
          emp.addEventListener("keydown", function (e) {
            if (e.key === "Enter") handleClockIn();
          });
        }
        const clockIn = document.getElementById("btn-clock-in");
        if (clockIn) clockIn.addEventListener("click", handleClockIn);

        viewRoot.querySelectorAll("[data-option]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.selectedOption = Number(btn.getAttribute("data-option"));
            viewRoot.querySelectorAll(".option").forEach(function (opt) {
              opt.classList.remove("selected");
              const dot = opt.querySelector(".radio-dot");
              if (dot) dot.innerHTML = "";
            });
            btn.classList.add("selected");
            const dot = btn.querySelector(".radio-dot");
            if (dot) dot.innerHTML = "<span></span>";
          });
        });
        const submitAns = document.getElementById("btn-submit-answer");
        if (submitAns) submitAns.addEventListener("click", handleAnswerSubmit);

        viewRoot.querySelectorAll("[data-field]").forEach(function (input) {
          input.addEventListener("focus", function () {
            const index = Number(input.getAttribute("data-idx"));
            const field = input.getAttribute("data-field");
            if (state.activeInput && state.activeInput.index === index && state.activeInput.field === field) {
              return;
            }
            state.activeInput = { index: index, field: field };
            updateActiveFieldDOM();
          });
          input.addEventListener("input", function () {
            const idx = Number(input.getAttribute("data-idx"));
            const field = input.getAttribute("data-field");
            const cleanVal = input.value.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
            state.session.machineRecords[idx][field] = cleanVal;
            const pos = input.selectionStart;
            input.value = cleanVal;
            if (typeof pos === "number") input.setSelectionRange(pos, pos);
          });
        });

        viewRoot.querySelectorAll("[data-remove]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            const indexToRemove = Number(btn.getAttribute("data-remove"));
            state.session.machineRecords = state.session.machineRecords.filter(function (_, idx) {
              return idx !== indexToRemove;
            });
            if (state.activeInput && state.activeInput.index >= state.session.machineRecords.length) {
              state.activeInput = { index: 0, field: "machineNo" };
            }
            render();
          });
        });

        const addMachine = document.getElementById("btn-add-machine");
        if (addMachine) {
          addMachine.addEventListener("click", function () {
            if (state.session.machineRecords.length < 4) {
              state.session.machineRecords.push({ machineNo: "", bagNo: "" });
              render();
            }
          });
        }

        viewRoot.querySelectorAll("[data-key]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            handleKeypadPress(btn.getAttribute("data-key"));
          });
        });
        const keyClear = document.getElementById("key-clear");
        if (keyClear) keyClear.addEventListener("click", handleKeypadClear);
        const keyBack = document.getElementById("key-back");
        if (keyBack) keyBack.addEventListener("click", handleKeypadBackspace);
        const nextField = document.getElementById("btn-next-field");
        if (nextField) nextField.addEventListener("click", handleNextField);
        const saveRecord = document.getElementById("btn-save-record");
        if (saveRecord) saveRecord.addEventListener("click", handleRecordSubmit);

        const clockOut = document.getElementById("btn-clock-out");
        if (clockOut) clockOut.addEventListener("click", handleClockOut);

        const adminPass = document.getElementById("admin-pass");
        if (adminPass) {
          adminPass.addEventListener("input", function (e) {
            state.adminPassword = e.target.value;
          });
          adminPass.addEventListener("keydown", function (e) {
            if (e.key === "Enter") handleAdminLoginSubmit();
          });
        }
        const adminLogin = document.getElementById("btn-admin-login");
        if (adminLogin) adminLogin.addEventListener("click", handleAdminLoginSubmit);

        viewRoot.querySelectorAll("[data-tab]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.adminTab = btn.getAttribute("data-tab");
            render();
          });
        });
        const btnAi = document.getElementById("btn-ai");
        if (btnAi) btnAi.addEventListener("click", runAiAnalysis);
        const btnCopy = document.getElementById("btn-copy");
        if (btnCopy) btnCopy.addEventListener("click", copyToTSV);
        const btnExcel = document.getElementById("btn-excel");
        if (btnExcel) btnExcel.addEventListener("click", exportToExcel);

        const addQ = document.getElementById("btn-add-q");
        if (addQ) {
          addQ.addEventListener("click", function () {
            state.dbQuestions.push({
              id: Date.now().toString(),
              text: "新問題",
              options: ["選項A", "選項B", "選項C", "選項D"],
              correctIndex: 0
            });
            showToast("已新增一筆空白題目");
            render();
          });
        }
        viewRoot.querySelectorAll("[data-del-q]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            const qIndex = Number(btn.getAttribute("data-del-q"));
            state.dbQuestions = state.dbQuestions.filter(function (_, idx) {
              return idx !== qIndex;
            });
            showToast("題目已刪除");
            render();
          });
        });
        viewRoot.querySelectorAll("[data-qtitle]").forEach(function (input) {
          input.addEventListener("input", function () {
            state.dbQuestions[Number(input.getAttribute("data-qtitle"))].text = input.value;
          });
        });
        viewRoot.querySelectorAll("[data-qopt]").forEach(function (input) {
          input.addEventListener("input", function () {
            const qIndex = Number(input.getAttribute("data-qopt"));
            const oIndex = Number(input.getAttribute("data-o"));
            state.dbQuestions[qIndex].options[oIndex] = input.value;
          });
        });
        viewRoot.querySelectorAll('input[type="radio"][data-q]').forEach(function (input) {
          input.addEventListener("change", function () {
            const qIndex = Number(input.getAttribute("data-q"));
            const oIndex = Number(input.getAttribute("data-o"));
            state.dbQuestions[qIndex].correctIndex = oIndex;
            render();
          });
        });
      }

      btnHome.addEventListener("click", function () {
        state.currentView = "login";
        render();
      });

      btnAdmin.addEventListener("click", function () {
        if (state.currentView === "admin" || state.currentView === "adminLogin") {
          state.currentView = "login";
        } else {
          state.currentView = state.isAdminAuth ? "admin" : "adminLogin";
        }
        render();
      });

      initFirebase();
      render();
    })();
  </script>
</body>
</html>
